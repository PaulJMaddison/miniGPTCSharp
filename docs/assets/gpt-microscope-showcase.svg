    <rect width="38" height="38" fill="#d7ff52"/><rect x="44" width="38" height="38" fill="#7e8f4a"/><rect x="88" width="38" height="38" fill="#44523a"/><rect x="132" width="38" height="38" fill="#2c332b"/><rect x="176" width="38" height="38" fill="#222822"/>
    <rect y="44" width="38" height="38" fill="#44d7b6"/><rect x="44" y="44" width="38" height="38" fill="#d7ff52"/><rect x="88" y="44" width="38" height="38" fill="#7e8f4a"/><rect x="132" y="44" width="38" height="38" fill="#44523a"/><rect x="176" y="44" width="38" height="38" fill="#2c332b"/>
    <rect y="88" width="38" height="38" fill="#c6754d"/><rect x="44" y="88" width="38" height="38" fill="#44d7b6"/><rect x="88" y="88" width="38" height="38" fill="#d7ff52"/><rect x="132" y="88" width="38" height="38" fill="#7e8f4a"/><rect x="176" y="88" width="38" height="38" fill="#44523a"/>
    <rect y="132" width="38" height="38" fill="#3b4038"/><rect x="44" y="132" width="38" height="38" fill="#c6754d"/><rect x="88" y="132" width="38" height="38" fill="#44d7b6"/><rect x="132" y="132" width="38" height="38" fill="#d7ff52"/><rect x="176" y="132" width="38" height="38" fill="#7e8f4a"/>
  </g>
  <rect x="140" y="500" width="1000" height="1" fill="#3b4038"/>
  <text x="140" y="532" fill="#d7ff52" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650">CLI + Web + Reports + Tests</text>
  <text x="384" y="532" fill="#beb8a9" font-family="Segoe UI, Arial, sans-serif" font-size="18">A compact explainable-AI portfolio system for .NET teams</text>
