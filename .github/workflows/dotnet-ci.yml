name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: Windows .NET 8 build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore miniGPTCSharp.sln

      - name: Build
        run: dotnet build miniGPTCSharp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MiniGPTCSharp.Tests/MiniGPTCSharp.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: CLI smoke
        run: |
          dotnet run --configuration Release --no-build --project MiniGPTCSharp.Cli/MiniGPTCSharp.Cli.csproj -- predict --prompt "The capital of France is" --topn 3 --json
          dotnet run --configuration Release --no-build --project MiniGPTCSharp.Cli/MiniGPTCSharp.Cli.csproj -- report --prompt "The capital of France is" --out artifacts/ci-report.html --tokens 4 --dims 4
